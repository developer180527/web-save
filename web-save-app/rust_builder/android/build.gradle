// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.websave_bridge'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.websave_bridge'
    }

    // Kept equal to the app's compileSdk, which Flutter's Gradle plugin sets
    // (36 as of Flutter 3.44). The template's 33 fails the release build:
    // AndroidX libraries the app pulls in require compiling against 34+, and
    // AGP checks that against every module, this one included. The template
    // warns that raising it forces every client app to follow, but this
    // plugin has exactly one client, and it is already there.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../../bridge"
    libname = "websave_bridge"
}
